<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Grocery Shop</title>
<style>
body{font-family:Arial;margin:0;background:#f3f5f7;color:#222}
header{background:#087f3e;color:white;padding:18px;text-align:center}
nav{display:flex;gap:6px;padding:8px;background:white;overflow:auto}
nav button{padding:10px;border:0;border-radius:8px;background:#e5e5e5;white-space:nowrap}
main{padding:12px}
.card{background:white;padding:15px;margin-bottom:12px;border-radius:12px;box-shadow:0 2px 6px #ddd}
input,select,button{font-size:16px;padding:11px;margin:5px 0;border-radius:7px;border:1px solid #ccc;box-sizing:border-box}
input,select{width:100%}
button{background:#087f3e;color:white;border:0}
.danger{background:#c62828}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:25px;font-weight:bold}
.item{border-bottom:1px solid #ddd;padding:10px 0}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>🛒 My Grocery Shop</h1>
<div>Stock & Sales Manager</div>
</header>

<nav>
<button onclick="show('dashboard')">🏠 Home</button>
<button onclick="show('stock')">📦 Stock</button>
<button onclick="show('sale')">🛒 Sale</button>
<button onclick="show('customers')">👥 Customers</button>
<button onclick="show('expenses')">💸 Expenses</button>
<button onclick="show('reports')">📊 Reports</button>
</nav>

<main>

<section id="dashboard">
<div class="card">
<h2>Dashboard</h2>
<div class="grid">
<div>Products<br><span class="big" id="productCount">0</span></div>
<div>Stock<br><span class="big" id="stockCount">0</span></div>
<div>Sales<br><span class="big" id="salesTotal">R0</span></div>
<div>Expenses<br><span class="big" id="expenseTotal">R0</span></div>
</div>
</div>
</section>

<section id="stock" class="hidden">
<div class="card">
<h2>📦 Add Stock</h2>
<input id="pname" placeholder="Product name">
<input id="barcode" placeholder="Barcode">
<input id="qty" type="number" placeholder="Quantity">
<input id="buy" type="number" step="0.01" placeholder="Buying price (R)">
<input id="sell" type="number" step="0.01" placeholder="Selling price (R)">
<button onclick="addProduct()">Add / Stock In</button>
</div>

<div class="card">
<h2>Current Stock</h2>
<div id="stockList"></div>
</div>
</section>

<section id="sale" class="hidden">
<div class="card">
<h2>🛒 Make Sale</h2>
<select id="saleProduct"></select>
<input id="saleQty" type="number" value="1" min="1">
<select id="payment">
<option>Cash</option>
<option>Card</option>
<option>Mobile</option>
<option>Credit</option>
</select>
<button onclick="makeSale()">Complete Sale</button>
</div>
</section>

<section id="customers" class="hidden">
<div class="card">
<h2>👥 Customers</h2>
<input id="customerName" placeholder="Customer name">
<input id="customerPhone" placeholder="Phone number">
<button onclick="addCustomer()">Add Customer</button>
<div id="customerList"></div>
</div>
</section>

<section id="expenses" class="hidden">
<div class="card">
<h2>💸 Add Expense</h2>
<input id="expenseName" placeholder="Expense description">
<input id="expenseAmount" type="number" step="0.01" placeholder="Amount (R)">
<button onclick="addExpense()">Add Expense</button>
<div id="expenseList"></div>
</div>
</section>

<section id="reports" class="hidden">
<div class="card">
<h2>📊 Reports</h2>
<p>Total sales: <b id="reportSales">R0</b></p>
<p>Total expenses: <b id="reportExpenses">R0</b></p>
<p>Estimated balance: <b id="reportBalance">R0</b></p>
</div>
<div class="card">
<h2>Recent Sales</h2>
<div id="salesList"></div>
</div>
</section>

</main>

<script>
let products=JSON.parse(localStorage.getItem("products")||"[]");
let sales=JSON.parse(localStorage.getItem("sales")||"[]");
let customers=JSON.parse(localStorage.getItem("customers")||"[]");
let expenses=JSON.parse(localStorage.getItem("expenses")||"[]");

function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("sales",JSON.stringify(sales));
localStorage.setItem("customers",JSON.stringify(customers));
localStorage.setItem("expenses",JSON.stringify(expenses));
}

function show(id){
document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
refresh();
}

function addProduct(){
let name=document.getElementById("pname").value.trim();
let barcode=document.getElementById("barcode").value.trim();
let qty=Number(document.getElementById("qty").value);
let buy=Number(document.getElementById("buy").value);
let sell=Number(document.getElementById("sell").value);

if(!name||qty<=0||sell<=0){
alert("Please enter product, quantity and selling price.");
return;
}

let old=products.find(p=>p.barcode&&barcode&&p.barcode===barcode);

if(old){
old.qty+=qty;
old.buy=buy;
old.sell=sell;
}else{
products.push({id:Date.now(),name,barcode,qty,buy,sell});
}

save();
document.getElementById("pname").value="";
document.getElementById("barcode").value="";
document.getElementById("qty").value="";
document.getElementById("buy").value="";
document.getElementById("sell").value="";
refresh();
alert("Stock added successfully!");
}

function makeSale(){
let id=Number(document.getElementById("saleProduct").value);
let qty=Number(document.getElementById("saleQty").value);
let payment=document.getElementById("payment").value;
let p=products.find(x=>x.id===id);

if(!p||qty<=0){alert("Choose a product.");return;}
if(p.qty<qty){alert("Not enough stock.");return;}

p.qty-=qty;

sales.push({
date:new Date().toLocaleString(),
product:p.name,
qty:qty,
total:p.sell*qty,
payment:payment
});

save();
refresh();
alert("Sale completed!");
}

function addCustomer(){
let name=document.getElementById("customerName").value.trim();
let phone=document.getElementById("customerPhone").value.trim();

if(!name){alert("Enter customer name.");return;}

customers.push({name,phone});
save();
document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
refresh();
}

function addExpense(){
let name=document.getElementById("expenseName").value.trim();
let amount=Number(document.getElementById("expenseAmount").value);

if(!name||amount<=0){alert("Enter expense details.");return;}

expenses.push({
name:name,
amount:amount,
date:new Date().toLocaleString()
});

save();
document.getElementById("expenseName").value="";
document.getElementById("expenseAmount").value="";
refresh();
}

function refresh(){

document.getElementById("productCount").textContent=products.length;

document.getElementById("stockCount").textContent=
products.reduce((a,p)=>a+p.qty,0);

let st=sales.reduce((a,s)=>a+s.total,0);
let ex=expenses.reduce((a,e)=>a+e.amount,0);

document.getElementById("salesTotal").textContent="R"+st.toFixed(2);
document.getElementById("expenseTotal").textContent="R"+ex.toFixed(2);

document.getElementById("reportSales").textContent="R"+st.toFixed(2);
document.getElementById("reportExpenses").textContent="R"+ex.toFixed(2);
document.getElementById("reportBalance").textContent="R"+(st-ex).toFixed(2);

let list=document.getElementById("stockList");
list.innerHTML="";

products.forEach(p=>{
list.innerHTML+=`
<div class="item">
<b>${p.name}</b><br>
Barcode: ${p.barcode||"-"}<br>
Stock: ${p.qty} | Sell: R${p.sell.toFixed(2)}
</div>`;
});

let select=document.getElementById("saleProduct");
select.innerHTML="";

products.forEach(p=>{
if(p.qty>0){
select.innerHTML+=`<option value="${p.id}">
${p.name} — ${p.qty} in stock — R${p.sell.toFixed(2)}
</option>`;
}
});

let cl=document.getElementById("customerList");
cl.innerHTML="";
customers.forEach(c=>{
cl.innerHTML+=`<div class="item"><b>${c.name}</b><br>${c.phone||""}</div>`;
});

let el=document.getElementById("expenseList");
el.innerHTML="";
expenses.slice().reverse().forEach(e=>{
el.innerHTML+=`<div class="item">${e.name} — R${e.amount.toFixed(2)}<br>${e.date}</div>`;
});

let sl=document.getElementById("salesList");
sl.innerHTML="";
sales.slice().reverse().slice(0,20).forEach(s=>{
sl.innerHTML+=`<div class="item">
<b>${s.product}</b> × ${s.qty}<br>
R${s.total.toFixed(2)} — ${s.payment}<br>${s.date}
</div>`;
});
}

refresh();
</script>

</body>
</html>
